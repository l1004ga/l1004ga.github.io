<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Link Redirect</title>
</head>

<body>
  <script type="text/javascript">
    window.onload = function () {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      var appStoreURL;
      var deepLinkURL;
      var language = navigator.language || navigator.userLanguage;
      var countryCode = language.split('-')[1] || 'us';

      var urlParams = new URLSearchParams(window.location.search);
      var storeId = urlParams.get('storeId');
      var promotionId = urlParams.get('promotionId');

      console.log("StoreId:", storeId);
      console.log("PromotionId:", promotionId);

      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        // iOS
        appStoreURL = `https://apps.apple.com/${countryCode}/app/keynote/id361285480`;

        if (storeId) {
          deepLinkURL = "oishare://map/store?id=" + storeId;
        } else if (promotionId) {
          deepLinkURL = "oishare://promotion/detail?id=" + promotionId;
        } else {
          alert("유효한 파라미터가 없습니다.");
          return;
        }

      } else if (/android/i.test(userAgent)) {
        // Android
        appStoreURL = 'https://play.google.com/store/apps/details?id=com.google.android.apps.docs';

        if (storeId) {
          deepLinkURL = "oishare://map/store?id=" + storeId;
        } else if (promotionId) {
          deepLinkURL = "oishare://promotion/detail?id=" + promotionId;
        } else {
          alert("유효한 파라미터가 없습니다.");
          return;
        }

      } else {
        alert("이 페이지는 Android와 iOS에서만 작동합니다.");
        return;
      }

      var focusLost = false;
      window.addEventListener("blur", function () {
        focusLost = true; // deep link success
      });

      // 딥링크 시도
      window.location = deepLinkURL;

      // 일정 시간 후 앱스토어로 리디렉션
      setTimeout(function () {
        if (!focusLost) {
          window.location = appStoreURL;
        }
      }, 5000);
    }
  </script>

</body>

</html>
