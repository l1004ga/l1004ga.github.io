<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Link Redirect</title>
</head>

<body>
  <script setup>
    const userAgent = navigator.userAgent || navigator.vendor || window.opera
    let appStoreURL
    let deepLinkURL
    // const language = navigator.language || navigator.userLanguage
    // const countryCode = language.split('-')[1] || 'us' // 언어 코드에서 국가 코드 추출, 기본값은 'us'

    const urlParams = new URLSearchParams(window.location.search)
    const storeId = urlParams.get('storeId')
    const promotionId = urlParams.get('promotionId')

    function isIOS() {
      return /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream
    }
    function isAndroid() {
      return /android/i.test(userAgent)
    }

    if (path.includes('/share')) {
      if (isIOS()) {
        console.log('ios')
        // iOS
        appStoreURL = `https://apps.apple.com/{countryCode}/app/keynote/id361285480` // 앱스토어 앱 링크 (임시)
        deepLinkURL = path.includes('storeId=')
          ? 'oishare://map/store?id=' + storeId
          : 'oishare://map/promotion?id=' + promotionId
      } else if (isAndroid()) {
        console.log('android')
        // Android
        appStoreURL = 'https://play.google.com/store/apps/details?id=com.google.android.apps.docs'
        deepLinkURL = path.includes('storeId=')
          ? 'oishare://map/store?id=' + storeId
          : 'oishare://map/promotion?id=' + promotionId
      } else {
        window.location = 'https://web-dev.oi-app.net'
      }
    }

    if (path.includes('/qrcode')) {
      if (isIOS()) {
        console.log('ios')
        // iOS
        appStoreURL = `https://apps.apple.com/{countryCode}/app/keynote/id361285480` // 앱스토어 앱 링크 (임시)
        deepLinkURL = path.includes('storeId=')
          ? 'oishare://map/store?id=' + storeId
          : 'oishare://map/promotion?id=' + promotionId
      } else if (isAndroid()) {
        console.log('android')
        // Android
        appStoreURL = 'https://play.google.com/store/apps/details?id=com.google.android.apps.docs'
        deepLinkURL = path.includes('storeId=')
          ? 'oishare://map/store?id=' + storeId
          : 'oishare://map/promotion?id=' + promotionId
      } else {
        // 다른 플랫폼이거나 지원하지 않는 경우
        alert('이 페이지는 Android와 iOS에서만 작동합니다.')
        window.location = '/'
      }
    }

    // 딥링크를 시도합니다.
    window.location = deepLinkURL

    let focusLost = false
    window.addEventListener('blur', function () {
      focusLost = true //deep link success
    })

    // 일정 시간 후 앱스토어로 리디렉션합니다.
    setTimeout(function () {
      if (!focusLost) {
        window.location = appStoreURL
      }
    }, 5000) // 5초 후 앱스토어로 리디렉션
  </script>


</body>

</html>
